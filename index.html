<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Daily Expense Tracker</title>
</head>
<body>
  <h1>Daily Expense Tracker</h1>

  <h2>Add an expense</h2>
  <form id="expense-form">
    <input type="hidden" id="expense-id">
    <input type="number" id="amount" placeholder="Amount" step="0.01" required>
    <input type="text" id="category" placeholder="Category" required>
    <input type="text" id="description" placeholder="Description">
    <button type="submit">Save</button>
  </form>
    <h2>Expenses</h2>
    <h2>Summary</h2>
    <p id="total"></p>
    <ul id="summary-list"></ul>
    <ul id="expense-list"></ul>
    <h2>Set a Budget</h2>
    <form id="budget-form">
        <input type="text" id="budget-category" placeholder="Category" required>
        <input type="number" id="budget-limit" placeholder="Monthly limit" step="0.01" required>
        <button type="submit">Set Budget</button>
    </form>
    <script>
    const API_URL = "http://127.0.0.1:5000";
    const form = document.getElementById("expense-form");
    function loadExpenses() {
    fetch(`${API_URL}/expenses`)
        .then((response) => response.json())
        .then((expenses) => {
        const list = document.getElementById("expense-list");
        list.innerHTML = "";

        expenses.forEach((expense) => {
            const item = document.createElement("li");
            item.textContent = `${expense.date} - ${expense.category}: €${expense.amount} (${expense.description}) `;

            const editButton = document.createElement("button");
            editButton.textContent = "Edit";
            editButton.type = "button";
            editButton.addEventListener("click", function () {
            editExpense(expense);
            });

            const deleteButton = document.createElement("button");
            deleteButton.textContent = "Delete";
            deleteButton.type = "button";
            deleteButton.addEventListener("click", function () {
            deleteExpense(expense.id);
            });

            item.appendChild(editButton);
            item.appendChild(deleteButton);
            list.appendChild(item);
        });
        });
    }

    function editExpense(expense) {
        document.getElementById("expense-id").value = expense.id;
        document.getElementById("amount").value = expense.amount;
        document.getElementById("category").value = expense.category;
        document.getElementById("description").value = expense.description;
    }
    
    
    function deleteExpense(id) {
        fetch(`${API_URL}/expenses/${id}`, {
            method: "DELETE",
        })
        .then((response) => response.json())
        .then((data) => {
            console.log("Deleted:", data);
            loadExpenses();
            loadSummary();
        })
        .catch((error) => {
            console.error("Error:", error);
        });
    }



    loadExpenses();

function loadSummary() {
  fetch(`${API_URL}/summary`)
    .then((response) => response.json())
    .then((summary) => {
      document.getElementById("total").textContent = `Total spent: €${summary.total}`;

      const list = document.getElementById("summary-list");
      list.innerHTML = "";

      const categorySelect = document.getElementById("budget-category");
      categorySelect.innerHTML = '<option value="">Select a category</option>';

      summary.by_category.forEach((entry) => {
        const item = document.createElement("li");
        let text = `${entry.category}: €${entry.total}`;

        if (entry.budget !== null) {
          text += ` (budget: €${entry.budget})`;
          if (entry.over_budget) {
            text += " — OVER BUDGET";
          }
        }

        item.textContent = text + " ";

        const editButton = document.createElement("button");
        editButton.textContent = "Edit Budget";
        editButton.type = "button";
        editButton.addEventListener("click", function () {
          editBudget(entry.category, entry.budget);
        });

        item.appendChild(editButton);
        list.appendChild(item);

        const option = document.createElement("option");
        option.value = entry.category;
        option.textContent = entry.category;
        categorySelect.appendChild(option);
      });
    });
}

function editBudget(category, budget) {
  document.getElementById("budget-category").value = category;
  document.getElementById("budget-limit").value = budget !== null ? budget : "";
}

    loadSummary();

    form.addEventListener("submit", function (event) {
        event.preventDefault();

        const id = document.getElementById("expense-id").value;
        const amount = document.getElementById("amount").value;
        const category = document.getElementById("category").value;
        const description = document.getElementById("description").value;

        const body = JSON.stringify({
            amount: parseFloat(amount),
            category: category,
            description: description,
        });

        const url = id ? `${API_URL}/expenses/${id}` : `${API_URL}/expenses`;
        const method = id ? "PUT" : "POST";

        fetch(url, {
            method: method,
            headers: { "Content-Type": "application/json" },
            body: body,
        })
        .then((response) => response.json())
        .then((data) => {
            console.log("Saved:", data);
            form.reset();
            document.getElementById("expense-id").value = "";
            loadExpenses();
            loadSummary();
        })
        .catch((error) => {
            console.error("Error:", error);
        });
    });
    const budgetForm = document.getElementById("budget-form");

    budgetForm.addEventListener("submit", function (event) {
        event.preventDefault();

        const category = document.getElementById("budget-category").value;
        const monthlyLimit = document.getElementById("budget-limit").value;

        fetch(`${API_URL}/budgets`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                category: category,
                monthly_limit: parseFloat(monthlyLimit),
            }),
        })
        .then((response) => response.json())
        .then((data) => {
            console.log("Budget set:", data);
            budgetForm.reset();
            loadSummary();
        })
        .catch((error) => {
            console.error("Error:", error);
        });
    });
    
    </script>
</body>
</html>
